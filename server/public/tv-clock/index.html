<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart TV Clock Face Display</title>
  <!-- Google Fonts for High-Fidelity Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: none; /* Hide cursor on TV */
    }

    #stage-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      transition: transform 1.2s ease;
    }

    /* Background Layer */
    #bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.8s ease, background 0.8s ease;
      z-index: 1;
    }

    /* Overlay Tint / Blur Layer */
    #overlay-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      transition: background-color 0.5s ease, backdrop-filter 0.5s ease;
      pointer-events: none;
    }

    /* Vignette Layer */
    #vignette-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.75) 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    /* Scanlines effect for Futuristic / Neon */
    #scanlines-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    /* Content Stage */
    #clock-stage {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      display: flex;
      padding: 4vw;
      transition: opacity 0.4s ease;
    }

    /* Clock Wrapper */
    .clock-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 100%;
      transition: transform 0.3s ease;
    }

    /* Alignment Classes */
    .align-h-left { align-items: flex-start; text-align: left; }
    .align-h-center { align-items: center; text-align: center; }
    .align-h-right { align-items: flex-end; text-align: right; }

    .align-v-top { justify-content: flex-start; }
    .align-v-center { justify-content: center; }
    .align-v-bottom { justify-content: flex-end; }

    /* Time Display Base */
    .time-container {
      display: flex;
      align-items: baseline;
      line-height: 1;
      white-space: nowrap;
    }

    .time-digits {
      display: inline-block;
      font-variant-numeric: tabular-nums;
    }

    .time-colon {
      display: inline-block;
      margin: 0 0.05em;
      opacity: 0.95;
    }

    .time-seconds {
      display: inline-block;
      margin-left: 0.12em;
      opacity: 0.75;
      font-size: 0.42em;
      font-variant-numeric: tabular-nums;
    }

    .time-ampm {
      display: inline-block;
      margin-left: 0.15em;
      font-size: 0.3em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.8;
    }

    /* Date Display Base */
    .date-container {
      margin-top: 0.3em;
      font-weight: 500;
      letter-spacing: 0.02em;
      line-height: 1.2;
      opacity: 0.9;
    }

    /* Pill container for Modern Digital */
    .modern-pill {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 28px;
      padding: 2.2rem 3.4rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* Flip Clock Cards */
    .flip-container {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .flip-group {
      display: flex;
      gap: 0.4rem;
    }

    .flip-card {
      position: relative;
      background: #18181b;
      color: #fafafa;
      border-radius: 12px;
      padding: 0.4rem 0.8rem;
      font-size: 6.5rem;
      font-family: 'Bebas Neue', sans-serif;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 4.8rem;
    }

    .flip-card::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 2px;
      background: rgba(0, 0, 0, 0.85);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.12);
      z-index: 2;
    }

    .flip-divider {
      font-size: 4rem;
      font-weight: 700;
      opacity: 0.6;
      margin: 0 0.1rem;
    }

    .flip-seconds-card {
      font-size: 3.5rem;
      min-width: 2.8rem;
      padding: 0.3rem 0.5rem;
      border-radius: 8px;
    }

    /* Analog Clock Styles */
    .analog-clock-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .analog-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 15px 35px rgba(0,0,0,0.6));
    }

    /* Date & Time Dashboard Grid */
    .dashboard-container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .dashboard-main-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 2.5rem 3.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    }

    .dashboard-badges {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }

    .dashboard-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }

    /* Discreet TV HUD when remote is pressed */
    #tv-hud {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.6rem 1.4rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 100;
    }

    #tv-hud.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #tv-hud .hud-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
  </style>
</head>
<body>
  <div id="stage-container">
    <!-- Visual background layers -->
    <div id="bg-layer"></div>
    <div id="overlay-layer"></div>
    <div id="vignette-layer"></div>
    <div id="scanlines-layer"></div>

    <!-- Active clock interface -->
    <main id="clock-stage" class="align-h-center align-v-center">
      <div id="clock-wrapper" class="clock-wrapper align-h-center">
        <!-- Injected via JavaScript dynamically -->
      </div>
    </main>

    <!-- TV HUD notification -->
    <div id="tv-hud">
      <span class="hud-dot"></span>
      <span id="hud-text">Smart TV Clock • Connected</span>
    </div>
  </div>

  <script>
    (function () {
      let currentFace = null;
      let animFrameId = null;
      let lastSecond = -1;
      let hudTimer = null;
      let burnInShiftX = 0;
      let burnInShiftY = 0;

      const stage = document.getElementById('stage-container');
      const bgLayer = document.getElementById('bg-layer');
      const overlayLayer = document.getElementById('overlay-layer');
      const vignetteLayer = document.getElementById('vignette-layer');
      const scanlinesLayer = document.getElementById('scanlines-layer');
      const clockStage = document.getElementById('clock-stage');
      const clockWrapper = document.getElementById('clock-wrapper');
      const tvHud = document.getElementById('tv-hud');
      const hudText = document.getElementById('hud-text');

      // ---------------- Cache & Persistence ----------------
      function loadCachedConfig() {
        try {
          const raw = localStorage.getItem('tv_clock_face_config');
          if (raw) {
            const data = JSON.parse(raw);
            if (data && data.config) {
              applyClockFace(data);
            }
          }
        } catch (e) {
          console.warn('Could not read cached config:', e);
        }
      }

      function saveCachedConfig(data) {
        try {
          localStorage.setItem('tv_clock_face_config', JSON.stringify(data));
        } catch (e) {}
      }

      // ---------------- Date Formatting Helper ----------------
      function formatCustomDate(d, formatStr, showDay, showMonth, showYear) {
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const daysShort = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const monthsShort = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        const dayName = days[d.getDay()];
        const dayShort = daysShort[d.getDay()];
        const monthName = months[d.getMonth()];
        const monthShort = monthsShort[d.getMonth()];
        const dateNum = d.getDate();
        const year = d.getFullYear();

        if (formatStr === 'EEEE, d MMMM') {
          return `${dayName}, ${dateNum} ${monthName}${showYear ? ' ' + year : ''}`;
        } else if (formatStr === 'EEE, d MMM') {
          return `${dayShort}, ${dateNum} ${monthShort}${showYear ? ' ' + year : ''}`;
        } else if (formatStr === 'Tuesday 27 October') {
          return `${dayName} ${dateNum} ${monthName}${showYear ? ' ' + year : ''}`;
        } else if (formatStr === 'EEEE, MMMM d, yyyy') {
          return `${dayName}, ${monthName} ${dateNum}, ${year}`;
        } else if (formatStr === 'MMMM d, yyyy') {
          return `${monthName} ${dateNum}, ${year}`;
        } else if (formatStr === 'YYYY.MM.DD // PROTOCOL-7') {
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(dateNum).padStart(2, '0');
          return `${year}.${m}.${day} // PROTOCOL-7`;
        } else {
          return `${dayName}, ${dateNum} ${monthName} ${year}`;
        }
      }

      // ---------------- Apply Clock Face ----------------
      function applyClockFace(face) {
        if (!face || !face.config) return;
        currentFace = face;
        saveCachedConfig(face);

        const cfg = face.config;
        const style = face.style || 'minimal-digital';

        // 1. Background Layer Setup
        if (cfg.backgroundMode === 'wallpaper' && cfg.wallpaperUrl) {
          bgLayer.style.backgroundImage = `url('${cfg.wallpaperUrl}')`;
          bgLayer.style.backgroundColor = 'transparent';
        } else if (cfg.backgroundMode === 'gradient' && cfg.backgroundGradient) {
          bgLayer.style.backgroundImage = cfg.backgroundGradient;
          bgLayer.style.backgroundColor = 'transparent';
        } else {
          bgLayer.style.backgroundImage = 'none';
          bgLayer.style.backgroundColor = cfg.backgroundColor || '#020617';
        }

        // 2. Overlay & Backdrop Blur
        const overlayOpacity = typeof cfg.overlayOpacity === 'number' ? cfg.overlayOpacity : 0.4;
        overlayLayer.style.backgroundColor = `rgba(0, 0, 0, ${overlayOpacity})`;
        const blurAmount = cfg.backdropBlur || 0;
        overlayLayer.style.backdropFilter = blurAmount > 0 ? `blur(${blurAmount}px)` : 'none';
        overlayLayer.style.webkitBackdropFilter = blurAmount > 0 ? `blur(${blurAmount}px)` : 'none';

        // 3. Vignette & Scanlines
        vignetteLayer.style.opacity = cfg.vignette ? '1' : '0';
        scanlinesLayer.style.opacity = cfg.scanlines ? '1' : '0';

        // 4. Alignment & Position
        clockStage.className = `align-h-${cfg.alignmentH || 'center'} align-v-${cfg.alignmentV || 'center'}`;
        clockWrapper.className = `clock-wrapper align-h-${cfg.alignmentH || 'center'}`;

        const xOff = (cfg.xOffset || 0) + burnInShiftX;
        const yOff = (cfg.yOffset || 0) + burnInShiftY;
        clockWrapper.style.transform = `translate(${xOff}px, ${yOff}px)`;

        // 5. Build Initial HTML Skeleton based on Style
        renderClockSkeleton(style, cfg);

        // 6. Trigger immediate update
        updateClockTime();

        // 7. Show brief HUD on TV
        showHud(`Applied: ${face.name}`);
      }

      // ---------------- Render Clock Skeleton ----------------
      function renderClockSkeleton(style, cfg) {
        clockWrapper.innerHTML = '';

        if (style === 'analog') {
          const dialSize = cfg.dialSize || 420;
          const container = document.createElement('div');
          container.className = 'analog-clock-container';
          container.style.width = `${dialSize}px`;
          container.style.height = `${dialSize}px`;

          const radius = dialSize / 2;
          const center = radius;

          // Generate Markers SVG
          let markersSvg = '';
          const markerStyle = cfg.markerStyle || 'ticks';
          const markerColor = cfg.markerColor || '#94a3b8';

          for (let i = 0; i < 12; i++) {
            const angle = (i * 30) * (Math.PI / 180);
            const isMain = i % 3 === 0;

            if (markerStyle === 'dots') {
              const r = radius - 24;
              const cx = center + r * Math.sin(angle);
              const cy = center - r * Math.cos(angle);
              markersSvg += `<circle cx="${cx}" cy="${cy}" r="${isMain ? 4 : 2.5}" fill="${markerColor}" opacity="${isMain ? 1 : 0.6}" />`;
            } else if (markerStyle === 'numbers') {
              const r = radius - 36;
              const cx = center + r * Math.sin(angle);
              const cy = center - r * Math.cos(angle) + 6;
              const num = i === 0 ? 12 : i;
              markersSvg += `<text x="${cx}" y="${cy}" font-family="${cfg.fontFamily || 'Outfit'}" font-size="${isMain ? 22 : 16}" font-weight="${isMain ? '700' : '500'}" fill="${markerColor}" text-anchor="middle" dominant-baseline="middle">${num}</text>`;
            } else if (markerStyle === 'roman') {
              const r = radius - 36;
              const cx = center + r * Math.sin(angle);
              const cy = center - r * Math.cos(angle) + 6;
              const romans = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
              if (isMain || markerStyle !== 'minimal') {
                markersSvg += `<text x="${cx}" y="${cy}" font-family="${cfg.fontFamily || 'Cinzel'}" font-size="${isMain ? 18 : 14}" font-weight="600" fill="${markerColor}" text-anchor="middle" dominant-baseline="middle">${romans[i]}</text>`;
              }
            } else if (markerStyle === 'minimal') {
              if (isMain) {
                const r1 = radius - 30;
                const r2 = radius - 16;
                const x1 = center + r1 * Math.sin(angle);
                const y1 = center - r1 * Math.cos(angle);
                const x2 = center + r2 * Math.sin(angle);
                const y2 = center - r2 * Math.cos(angle);
                markersSvg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${markerColor}" stroke-width="4" stroke-linecap="round" />`;
              }
            } else {
              // Default ticks
              const r1 = radius - (isMain ? 26 : 20);
              const r2 = radius - 14;
              const x1 = center + r1 * Math.sin(angle);
              const y1 = center - r1 * Math.cos(angle);
              const x2 = center + r2 * Math.sin(angle);
              const y2 = center - r2 * Math.cos(angle);
              markersSvg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${markerColor}" stroke-width="${isMain ? 3.5 : 2}" stroke-linecap="round" opacity="${isMain ? 1 : 0.6}" />`;
            }
          }

          const borderWidth = cfg.showBorder ? (cfg.dialBorderWidth || 4) : 0;
          const borderColor = cfg.dialBorderColor || '#38bdf8';
          const plateGradient = cfg.dialPlateGradient || 'radial-gradient(circle, #131e3a 0%, #060a14 100%)';

          container.innerHTML = `
            <svg class="analog-svg" viewBox="0 0 ${dialSize} ${dialSize}">
              <defs>
                <radialGradient id="dialGrad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#1e293b" />
                  <stop offset="100%" stop-color="#090d16" />
                </radialGradient>
              </defs>
              <!-- Dial Plate -->
              ${cfg.dialShape === 'squircle' 
                ? `<rect x="6" y="6" width="${dialSize - 12}" height="${dialSize - 12}" rx="64" fill="url(#dialGrad)" stroke="${borderColor}" stroke-width="${borderWidth}" />`
                : `<circle cx="${center}" cy="${center}" r="${radius - 6}" fill="url(#dialGrad)" stroke="${borderColor}" stroke-width="${borderWidth}" />`
              }
              <!-- Markers -->
              ${markersSvg}
              <!-- Hands -->
              <line id="analog-hour" x1="${center}" y1="${center}" x2="${center}" y2="${center - (cfg.hourLength || 65)}" stroke="${cfg.hourColor || '#ffffff'}" stroke-width="${cfg.hourWidth || 8}" stroke-linecap="round" />
              <line id="analog-minute" x1="${center}" y1="${center}" x2="${center}" y2="${center - (cfg.minuteLength || 85)}" stroke="${cfg.minuteColor || '#38bdf8'}" stroke-width="${cfg.minuteWidth || 5}" stroke-linecap="round" />
              ${cfg.showSeconds !== false ? `
                <line id="analog-second" x1="${center}" y1="${center + 20}" x2="${center}" y2="${center - (cfg.secondLength || 95)}" stroke="${cfg.secondColor || '#f97316'}" stroke-width="${cfg.secondWidth || 2}" stroke-linecap="round" />
                <circle cx="${center}" cy="${center}" r="${(cfg.pinSize || 10) / 2}" fill="${cfg.pinColor || '#f97316'}" />
              ` : `
                <circle cx="${center}" cy="${center}" r="6" fill="${cfg.hourColor || '#ffffff'}" />
              `}
            </svg>
          `;

          clockWrapper.appendChild(container);

          // Date below analog clock
          if (cfg.showDate) {
            const dateEl = document.createElement('div');
            dateEl.id = 'clock-date';
            dateEl.className = 'date-container';
            dateEl.style.fontFamily = cfg.fontFamily || 'Inter';
            dateEl.style.fontSize = `${cfg.dateFontSize || 22}px`;
            dateEl.style.color = cfg.dateColor || '#94a3b8';
            dateEl.style.opacity = cfg.dateOpacity || 0.85;
            dateEl.style.marginTop = '1.2rem';
            clockWrapper.appendChild(dateEl);
          }
          return;
        }

        if (style === 'flip') {
          const container = document.createElement('div');
          container.className = 'flip-container';
          container.innerHTML = `
            <div class="flip-group">
              <div class="flip-card" id="flip-h1" style="background:${cfg.cardBg || '#18181b'}; color:${cfg.cardTextColor || '#fafafa'}; border-radius:${cfg.cardRadius || 12}px">0</div>
              <div class="flip-card" id="flip-h2" style="background:${cfg.cardBg || '#18181b'}; color:${cfg.cardTextColor || '#fafafa'}; border-radius:${cfg.cardRadius || 12}px">0</div>
            </div>
            <div class="flip-divider" style="color:${cfg.cardTextColor || '#fafafa'}">:</div>
            <div class="flip-group">
              <div class="flip-card" id="flip-m1" style="background:${cfg.cardBg || '#18181b'}; color:${cfg.cardTextColor || '#fafafa'}; border-radius:${cfg.cardRadius || 12}px">0</div>
              <div class="flip-card" id="flip-m2" style="background:${cfg.cardBg || '#18181b'}; color:${cfg.cardTextColor || '#fafafa'}; border-radius:${cfg.cardRadius || 12}px">0</div>
            </div>
            ${cfg.showSeconds ? `
              <div class="flip-divider" style="color:${cfg.cardTextColor || '#fafafa'}; font-size: 2.5rem;">:</div>
              <div class="flip-group">
                <div class="flip-card flip-seconds-card" id="flip-s1" style="background:${cfg.cardBg || '#18181b'}; color:${cfg.cardTextColor || '#fafafa'}; border-radius:${(cfg.cardRadius || 12) * 0.75}px">0</div>
                <div class="flip-card flip-seconds-card" id="flip-s2" style="background:${cfg.cardBg || '#18181b'}; color:${cfg.cardTextColor || '#fafafa'}; border-radius:${(cfg.cardRadius || 12) * 0.75}px">0</div>
              </div>
            ` : ''}
            ${cfg.showAmPm ? `
              <div class="flip-card flip-seconds-card" id="flip-ampm" style="background:${cfg.cardBg || '#18181b'}; color:${cfg.cardTextColor || '#fafafa'}; font-size: 2rem; min-width: 3.5rem;">AM</div>
            ` : ''}
          `;
          clockWrapper.appendChild(container);

          if (cfg.showDate) {
            const dateEl = document.createElement('div');
            dateEl.id = 'clock-date';
            dateEl.className = 'date-container';
            dateEl.style.fontFamily = cfg.fontFamily || 'Inter';
            dateEl.style.fontSize = `${cfg.dateFontSize || 24}px`;
            dateEl.style.color = cfg.dateColor || '#e4e4e7';
            dateEl.style.opacity = cfg.dateOpacity || 0.9;
            dateEl.style.marginTop = '1.4rem';
            clockWrapper.appendChild(dateEl);
          }
          return;
        }

        if (style === 'date-time-dashboard') {
          const container = document.createElement('div');
          container.className = 'dashboard-container';

          const mainCard = document.createElement('div');
          mainCard.className = 'dashboard-main-card';

          const timeCont = document.createElement('div');
          timeCont.className = 'time-container';
          timeCont.id = 'time-container';
          mainCard.appendChild(timeCont);

          const badges = document.createElement('div');
          badges.className = 'dashboard-badges';
          badges.innerHTML = `
            <div class="dashboard-badge" id="dash-date-badge" style="color: ${cfg.accentColor || '#06b6d4'}; border-color: rgba(6, 182, 212, 0.3)">
              <span>📅</span>
              <span id="clock-date">Loading date...</span>
            </div>
            <div class="dashboard-badge">
              <span>⚡</span>
              <span>Sony BRAVIA 4K Active</span>
            </div>
          `;
          mainCard.appendChild(badges);
          container.appendChild(mainCard);
          clockWrapper.appendChild(container);
          applyTypographyToElement(timeCont, cfg);
          return;
        }

        // Digital styles (Minimal Digital, Modern Digital, Futuristic Neon, Minimal Typography)
        const wrapperCard = document.createElement('div');
        if (style === 'modern-digital' && cfg.pillBadge) {
          wrapperCard.className = 'modern-pill';
        }

        const timeCont = document.createElement('div');
        timeCont.className = 'time-container';
        timeCont.id = 'time-container';
        wrapperCard.appendChild(timeCont);

        if (cfg.showDate) {
          const dateEl = document.createElement('div');
          dateEl.id = 'clock-date';
          dateEl.className = 'date-container';
          dateEl.style.fontFamily = cfg.fontFamily || 'Inter';
          dateEl.style.fontSize = `${cfg.dateFontSize || 24}px`;
          dateEl.style.color = cfg.dateColor || '#94a3b8';
          dateEl.style.opacity = cfg.dateOpacity || 0.85;
          wrapperCard.appendChild(dateEl);
        }

        clockWrapper.appendChild(wrapperCard);
        applyTypographyToElement(timeCont, cfg);
      }

      function applyTypographyToElement(el, cfg) {
        el.style.fontFamily = cfg.fontFamily || 'Inter';
        el.style.fontWeight = cfg.fontWeight || '400';
        el.style.letterSpacing = `${cfg.letterSpacing || 0}em`;

        // Responsive font scaling
        const baseSize = cfg.fontSize || 100;
        el.style.fontSize = `${baseSize * 0.08}vw`;

        if (cfg.useGradient && cfg.gradientColors && cfg.gradientColors.length >= 2) {
          el.style.backgroundImage = `linear-gradient(${cfg.gradientAngle || 90}deg, ${cfg.gradientColors[0]}, ${cfg.gradientColors[1]})`;
          el.style.webkitBackgroundClip = 'text';
          el.style.webkitTextFillColor = 'transparent';
        } else {
          el.style.backgroundImage = 'none';
          el.style.webkitBackgroundClip = 'initial';
          el.style.webkitTextFillColor = 'initial';
          el.style.color = cfg.textColor || '#ffffff';
        }

        // Glow & Shadows
        let filterShadows = [];
        if (cfg.glow) {
          const glowCol = cfg.glowColor || '#38bdf8';
          const glowB = cfg.glowBlur || 20;
          filterShadows.push(`0 0 ${glowB}px ${glowCol}`, `0 0 ${glowB * 1.8}px ${glowCol}`);
        }
        if (cfg.textShadow) {
          filterShadows.push('0 4px 18px rgba(0, 0, 0, 0.7)');
        }
        el.style.textShadow = filterShadows.join(', ');
      }

      // ---------------- Update Clock Time ----------------
      function updateClockTime() {
        if (!currentFace || !currentFace.config) return;
        const cfg = currentFace.config;
        const style = currentFace.style || 'minimal-digital';

        const now = new Date();
        const sec = now.getSeconds();
        const ms = now.getMilliseconds();

        // 1. Analog Hands Movement
        if (style === 'analog') {
          const hHand = document.getElementById('analog-hour');
          const mHand = document.getElementById('analog-minute');
          const sHand = document.getElementById('analog-second');

          if (hHand && mHand) {
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = cfg.sweepMode === 'smooth' ? sec + ms / 1000 : sec;

            const hourDeg = (hours + minutes / 60 + seconds / 3600) * 30;
            const minuteDeg = (minutes + seconds / 60) * 6;
            const secondDeg = seconds * 6;

            const dialSize = cfg.dialSize || 420;
            const center = dialSize / 2;

            hHand.setAttribute('transform', `rotate(${hourDeg} ${center} ${center})`);
            mHand.setAttribute('transform', `rotate(${minuteDeg} ${center} ${center})`);
            if (sHand) {
              sHand.setAttribute('transform', `rotate(${secondDeg} ${center} ${center})`);
            }
          }
        }

        // 2. Flip Clock Update
        if (style === 'flip') {
          let hours = now.getHours();
          const isAm = hours < 12;
          if (!cfg.is24Hour) {
            hours = hours % 12 || 12;
          }
          const hStr = String(hours).padStart(2, '0');
          const mStr = String(now.getMinutes()).padStart(2, '0');
          const sStr = String(sec).padStart(2, '0');

          const h1 = document.getElementById('flip-h1');
          const h2 = document.getElementById('flip-h2');
          const m1 = document.getElementById('flip-m1');
          const m2 = document.getElementById('flip-m2');
          const s1 = document.getElementById('flip-s1');
          const s2 = document.getElementById('flip-s2');
          const ampm = document.getElementById('flip-ampm');

          if (h1 && h1.textContent !== hStr[0]) h1.textContent = hStr[0];
          if (h2 && h2.textContent !== hStr[1]) h2.textContent = hStr[1];
          if (m1 && m1.textContent !== mStr[0]) m1.textContent = mStr[0];
          if (m2 && m2.textContent !== mStr[1]) m2.textContent = mStr[1];
          if (s1 && s1.textContent !== sStr[0]) s1.textContent = sStr[0];
          if (s2 && s2.textContent !== sStr[1]) s2.textContent = sStr[1];
          if (ampm) ampm.textContent = isAm ? 'AM' : 'PM';
        }

        // 3. Digital Clock Text Update
        const timeCont = document.getElementById('time-container');
        if (timeCont) {
          let hours = now.getHours();
          const isAm = hours < 12;
          if (!cfg.is24Hour) {
            hours = hours % 12 || 12;
          }
          const hStr = String(hours).padStart(cfg.is24Hour ? 2 : 1, '0');
          const mStr = String(now.getMinutes()).padStart(2, '0');
          const sStr = String(sec).padStart(2, '0');

          let html = `
            <span class="time-digits">${hStr}</span>
            <span class="time-colon">:</span>
            <span class="time-digits">${mStr}</span>
          `;

          if (cfg.showSeconds) {
            html += `<span class="time-seconds">${sStr}</span>`;
          }

          if (cfg.showAmPm && !cfg.is24Hour) {
            html += `<span class="time-ampm">${isAm ? 'AM' : 'PM'}</span>`;
          }

          timeCont.innerHTML = html;
        }

        // 4. Date Update
        const dateEl = document.getElementById('clock-date');
        if (dateEl && sec !== lastSecond) {
          dateEl.textContent = formatCustomDate(now, cfg.dateFormat, cfg.showDay !== false, cfg.showMonth !== false, cfg.showYear !== false);
        }

        lastSecond = sec;
      }

      // ---------------- Main Clock Loop ----------------
      function startClockLoop() {
        function loop() {
          updateClockTime();
          animFrameId = requestAnimationFrame(loop);
        }
        loop();
      }

      // ---------------- Anti Burn-In OLED Drift ----------------
      function startAntiBurnInDrift() {
        setInterval(() => {
          if (!currentFace || !currentFace.config || !currentFace.config.antiBurnIn) return;
          // Random subtle drift of +/- 2 pixels
          burnInShiftX = (Math.random() - 0.5) * 4;
          burnInShiftY = (Math.random() - 0.5) * 4;
          const cfg = currentFace.config;
          const xOff = (cfg.xOffset || 0) + burnInShiftX;
          const yOff = (cfg.yOffset || 0) + burnInShiftY;
          clockWrapper.style.transform = `translate(${xOff}px, ${yOff}px)`;
        }, 60000); // Shift every 60 seconds
      }

      // ---------------- TV HUD ----------------
      function showHud(msg) {
        if (hudTimer) clearTimeout(hudTimer);
        hudText.textContent = msg;
        tvHud.classList.add('visible');
        hudTimer = setTimeout(() => {
          tvHud.classList.remove('visible');
        }, 3200);
      }

      // ---------------- TV Remote Key Listeners ----------------
      window.addEventListener('keydown', (e) => {
        // Android Back (4), Escape (27)
        if (e.keyCode === 4 || e.keyCode === 27) {
          showHud('Press TV Home button to return to launcher');
        } else if (e.keyCode === 13 || e.keyCode === 23) { // Enter / D-Pad Center
          if (currentFace) {
            showHud(`${currentFace.name} (${currentFace.style})`);
          }
        }
      });

      // ---------------- Socket.IO Synchronization ----------------
      function setupSocket() {
        try {
          const socket = io();

          socket.on('connect', () => {
            console.log('[TV Clock] Connected to Control Center server');
            socket.emit('tv_clock_online', {
              screen: `${window.innerWidth}x${window.innerHeight}`,
              userAgent: navigator.userAgent
            });
            fetchActiveFaceFromServer();
          });

          socket.on('clock_face_updated', (face) => {
            console.log('[TV Clock] Received real-time clock face update:', face);
            applyClockFace(face);
          });

          socket.on('disconnect', () => {
            console.warn('[TV Clock] Disconnected from server. Using offline cache.');
          });
        } catch (err) {
          console.warn('[TV Clock] Socket setup failed, fallback to local cache:', err);
        }
      }

      // ---------------- Fetch Active Face on Boot ----------------
      async function fetchActiveFaceFromServer() {
        try {
          const res = await fetch('/api/clock-faces/active');
          if (res.ok) {
            const data = await res.json();
            if (data && data.success && data.face) {
              applyClockFace(data.face);
            }
          }
        } catch (e) {
          console.warn('[TV Clock] Could not fetch active face from server:', e);
        }
      }

      // ---------------- Boot Initialization ----------------
      loadCachedConfig();
      fetchActiveFaceFromServer();
      setupSocket();
      startClockLoop();
      startAntiBurnInDrift();
    })();
  </script>
</body>
</html>
